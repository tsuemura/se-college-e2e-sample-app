name: CI

# Windows と Linux の両方で、サンプルアプリとテストコードが動作することを確認する
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # postinstall で Chromium もダウンロードされる
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium OS dependencies (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Run tests (tests/)
        run: npm test

      - name: Run solution tests (solutions/)
        run: npm run test:solutions

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
