name: CI

# 受講者が講座で行う手順をそのまま再現し、Windows と Linux の両方で
# 「アプリが動くこと」と「course/solutions のテストが通ること」を確認する。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # --- サンプルアプリのセットアップ（スライド「サンプルアプリのダウンロード」） ---
      - name: Install the app
        run: npm install

      # --- Playwright の導入（スライド「セットアップ：Playwright を入れる」） ---
      - name: Install Playwright
        run: npm install -D @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Copy the config and the solution tests
        shell: bash
        run: |
          cp course/playwright.config.ts .
          mkdir -p tests
          cp course/solutions/*.spec.ts tests/

      # --- テストの実行（スライド「実行する」） ---
      - name: Run tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
