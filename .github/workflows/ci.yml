name: CI

# Windows と Linux の両方で、サンプルアプリとテストコードが動作することを確認する
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # postinstall で Chromium もダウンロードされる
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium OS dependencies (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Run tests (tests/)
        run: npm test

      # v2 ブランチには意図的なリグレッション（ダブルブッキングが可能になる）を仕込んでいる。
      # v1 用の完成版テストのうち「予約済みの時間帯には予約できない」だけが失敗し、
      # 他はすべて成功することを確認する。
      - name: Run solution tests (solutions/) - one failure is expected
        id: solutions
        run: npm run test:solutions -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results-solutions.json
        continue-on-error: true

      - name: Verify that only the expected regression test failed
        run: node scripts/check-expected-failures.mjs results-solutions.json scripts/expected-failures.json

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
